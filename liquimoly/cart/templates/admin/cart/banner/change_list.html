{% extends "admin/change_list.html" %}
{% load i18n %}

{% block object-tools-items %}
    <li style="display: flex; align-items: center; margin-right: 3px;">
        <form action="{% url 'admin:banner_clear_region_cache' %}" method="post" style="margin: 0; display: flex; gap: 10px; align-items: center;">
            {% csrf_token %}
            <select name="place_id" style="padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; background-color: #fff; color: #333; cursor: pointer;">
                <option value="" disabled selected>Выберите регион</option>
                <option value="all">Очистить ВСЕ регионы</option>
                {% for place in places %}
                    <option value="{{ place.id }}">{{ place }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn btn-dark">
                🧹&nbsp;Очистить&nbsp;Кеш
            </button>
        </form>
    </li>
    {{ block.super }}
{% endblock %}
