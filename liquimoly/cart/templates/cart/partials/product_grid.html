{% load i18n %}
{% if products %}
<div class="product-grid{% if wide %} wide{% endif %}">
    {% for product in products %}
        {% include "cart/partials/product_card.html" with eager=forloop.counter0|yesno:",1" %}
    {% endfor %}
</div>
{% else %}
<div class="bg-white rounded-4 shadow-sm p-4 p-md-5 text-center text-secondary">
    <i class="bi bi-box-seam display-5 d-block mb-2"></i>
    {% translate "Häzirlikçe haryt ýok" %}
</div>
{% endif %}
