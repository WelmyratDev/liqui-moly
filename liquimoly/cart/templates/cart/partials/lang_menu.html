{% load static i18n %}{% get_current_language as LANGUAGE_CODE %}
<div class="dropdown {{ extra_class }}">
    <button class="nav-icon-btn fs-4" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Language">
        <i class="bi bi-globe"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
        <li>
            <form action="{% url 'set_language' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="language" value="tk">
                <button class="dropdown-item d-flex justify-content-between align-items-center gap-3">
                    <span><img src="{% static 'lang_logo/tkm.png' %}" alt="" height="14" width="21" class="me-2">Türkmen</span>
                    {% if LANGUAGE_CODE == "tk" %}<i class="bi bi-check-lg text-success"></i>{% endif %}
                </button>
            </form>
        </li>
        <li>
            <form action="{% url 'set_language' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="language" value="ru">
                <button class="dropdown-item d-flex justify-content-between align-items-center gap-3">
                    <span><img src="{% static 'lang_logo/rus.png' %}" alt="" height="14" width="21" class="me-2">Русский</span>
                    {% if LANGUAGE_CODE == "ru" %}<i class="bi bi-check-lg text-success"></i>{% endif %}
                </button>
            </form>
        </li>
        <li>
            <form action="{% url 'set_language' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="language" value="en">
                <button class="dropdown-item d-flex justify-content-between align-items-center gap-3">
                    <span><img src="{% static 'lang_logo/eng.png' %}" alt="" height="14" width="21" class="me-2">English</span>
                    {% if LANGUAGE_CODE == "en" %}<i class="bi bi-check-lg text-success"></i>{% endif %}
                </button>
            </form>
        </li>
    </ul>
</div>
