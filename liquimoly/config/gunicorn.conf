[program:liquimoly]
directory=/home/ubuntu/liqui_moly/liquimoly
; --max-requests: recycle workers periodically (protects against memory leaks)
; --timeout 60: first-time thumbnail generation of a big photo can take ~1s
command=/home/ubuntu/liqui_moly/venv/bin/gunicorn liquimoly.wsgi:application --bind 127.0.0.1:8000 --workers 3 --timeout 60 --max-requests 1000 --max-requests-jitter 100
user=ubuntu
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

stdout_logfile=/home/ubuntu/liqui_moly/liquimoly/logs/gunicorn.log
redirect_stderr=true

stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5

environment=DJANGO_SETTINGS_MODULE="liquimoly.settings"
